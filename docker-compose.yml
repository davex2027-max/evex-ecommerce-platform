services:
  mongo:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/evex_db
      - JWT_SECRET=supersecretjsonwebtokenkey
      - CORS_ORIGIN=http://localhost:5000
      - STRIPE_SECRET_KEY=sk_test_placeholder
      - STRIPE_WEBHOOK_SECRET=whsec_placeholder
    depends_on:
      - mongo
    restart: unless-stopped
    volumes:
      - uploads:/app/uploads

volumes:
  mongo-data:
  uploads:
